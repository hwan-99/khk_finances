.fm-root{--paper:#f7f3ea;--card:#fffdf8;--ink:#23201b;--mut:#857b6c;--line:#e7e0d2;--green:#2d6a4f;--gold:#b08524;--red:#8c3a2b;
  background:var(--paper);color:var(--ink);font-family:'Spline Sans',system-ui,sans-serif;padding:22px;min-height:100%;
  background-image:radial-gradient(#0000000a 0.5px,transparent 0.5px);background-size:14px 14px;}
.fm-root *{box-sizing:border-box;}
.num-input,.txt-input{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

/* header */
.fm-head{display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap;align-items:flex-end;padding-bottom:18px;border-bottom:1px solid var(--line);}
.fm-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--mut);}
.fm-net{font-family:'Fraunces',Georgia,serif;font-size:46px;line-height:1.02;font-weight:500;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;margin-top:4px;}
.fm-net-kr{font-family:'Fraunces',Georgia,serif;font-size:16px;color:var(--mut);margin-top:2px;}
.fm-head-r{display:flex;flex-direction:column;gap:12px;min-width:280px;flex:1;max-width:420px;}

/* goal bars */
.goalbar-top{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
.goalbar-pct{color:var(--green);font-weight:600;}
.goalbar.muted .goalbar-pct{color:var(--gold);}
.goalbar-track{height:8px;background:#ece5d6;border-radius:99px;overflow:hidden;}
.goalbar-fill{height:100%;background:linear-gradient(90deg,#2d6a4f,#3d8c66);border-radius:99px;transition:width .4s ease;}
.goalbar.muted .goalbar-fill{background:linear-gradient(90deg,#b08524,#c99b3a);}
.goalbar-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:3px;font-family:'IBM Plex Mono',monospace;}

/* nav */
.fm-nav{display:flex;gap:4px;margin:16px 0 18px;align-items:center;flex-wrap:wrap;}
.fm-tab{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--mut);
  padding:7px 13px;border-radius:8px;font-size:13.5px;font-family:'Spline Sans',sans-serif;cursor:pointer;transition:.15s;font-weight:500;}
.fm-tab:hover{color:var(--ink);background:#0000000a;}
.fm-tab.on{background:var(--ink);color:var(--paper);}
.fm-nav-tools{margin-left:auto;display:flex;gap:4px;}
.fm-icbtn{background:var(--card);border:1px solid var(--line);color:var(--mut);width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;transition:.15s;}
.fm-icbtn:hover{color:var(--ink);border-color:var(--mut);}
.fm-icbtn.on{color:var(--green);background:#eaf3ee;border-color:#cfe6da;}

/* layout */
.fm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.fm-grid2{grid-template-columns:1fr;}.fm-net{font-size:38px;}}

/* ------- mobile (phones) ------- */
@media(max-width:600px){
  .fm-root{padding:13px;background-size:12px 12px;}
  /* header stacks */
  .fm-head{gap:16px;padding-bottom:14px;}
  .fm-net{font-size:34px;}
  .fm-head-r{min-width:0;width:100%;max-width:none;}
  /* nav becomes a horizontal scroll strip so tabs never crush together */
  .fm-nav{flex-wrap:nowrap;overflow-x:auto;gap:5px;margin:13px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
  .fm-nav::-webkit-scrollbar{display:none;}
  .fm-tab{flex:0 0 auto;padding:8px 12px;font-size:13px;}
  .fm-nav-tools{margin-left:4px;flex:0 0 auto;}
  .fm-icbtn{width:34px;height:34px;}
  /* cards a touch tighter */
  .fm-card{padding:15px 14px 14px;border-radius:12px;}
  .fm-card-h h3{font-size:16px;}
  /* tables scroll sideways inside their own band rather than overflowing the page;
     charts (ResponsiveContainer) stay fluid and keep their tooltips */
  .fm-table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;min-width:0;}
  .fm-table thead,.fm-table tbody,.fm-table tfoot{display:table;width:100%;min-width:430px;}
  .num-input{width:88px;}
  /* charts/figures shrink gracefully */
  .big{font-size:24px;}
  .stats,.src-metrics,.ideal-top{grid-template-columns:1fr 1fr;}
  .ideal-controls{gap:14px;}
  /* allocation already stacks <520px; tighten gap */
  .alloc{gap:12px;}
  /* monthly + needs grids: keep horizontal scroll, comfortable tap targets */
  .need-cell,.mo-input{font-size:13px;}
  .seed-notice{flex-direction:column;align-items:flex-start;gap:8px;}
}
@media(max-width:380px){
  .fm-net{font-size:29px;}
  .stats,.src-metrics,.ideal-top{grid-template-columns:1fr;}
  .big{font-size:22px;}
}
.fm-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:0 1px 2px #0000000a;}
.fm-card.wide{grid-column:1/-1;}
.fm-card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.fm-card-h h3{margin:0;font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:500;}
.fm-card-sub{font-size:12px;color:var(--mut);font-family:'IBM Plex Mono',monospace;}

/* overview proj */
.proj-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:12px;}
.lbl{font-size:11px;color:var(--mut);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;}
.big{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;}
.big-kr{font-size:12.5px;color:var(--mut);}
.gapbox{text-align:right;padding:8px 12px;border-radius:10px;}
.gapbox.short{background:#fbeeec;color:var(--red);}
.gapbox.over{background:#eaf3ee;color:var(--green);}
.gapval{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;}

/* ideal projection */
.ideal-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:8px;}
.ideal-stat{border-left:2px solid var(--line);padding-left:12px;}
.ideal-controls{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.ic{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut);font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;}
.pct-wrap{display:inline-flex;align-items:baseline;gap:1px;}
.pct-input{border:none;background:transparent;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;width:46px;padding:4px;border-radius:5px;outline:none;}
.pct-input:focus{background:#f3eee2;}
.pct-sign{color:var(--mut);font-family:'IBM Plex Mono',monospace;font-size:13px;}

/* allocation */
.alloc{display:flex;align-items:center;gap:18px;}
.alloc-chart{flex:0 0 180px;width:180px;height:180px;}
.alloc-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
.leg{display:flex;align-items:center;gap:8px;font-size:13px;}
.dot{width:9px;height:9px;border-radius:3px;flex:none;}
.leg-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.leg-val{font-family:'IBM Plex Mono',monospace;color:var(--mut);font-variant-numeric:tabular-nums;}
@media(max-width:520px){.alloc{flex-direction:column;}.alloc-chart{flex:0 0 160px;width:160px;height:160px;}.alloc-legend{width:100%;}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.stat{border-left:2px solid var(--line);padding-left:12px;}
.stat-lbl{font-size:11.5px;color:var(--mut);font-family:'IBM Plex Mono',monospace;}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;}
.stat-kr{font-size:11.5px;color:var(--mut);}

/* table */
.fm-table{width:100%;border-collapse:collapse;font-size:14px;}
.fm-table th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:0 8px 9px;font-family:'IBM Plex Mono',monospace;border-bottom:1px solid var(--line);}
.fm-table th.r{text-align:right;}
.fm-table th.sortable{cursor:pointer;user-select:none;transition:.15s;}
.fm-table th.sortable:hover{color:var(--ink);}
.fm-table th .sc{font-size:9px;opacity:.55;margin-left:1px;}
.fm-table th.c,.fm-table td.c{text-align:center;}
.install-note{font-size:10.5px;color:var(--gold);font-family:'IBM Plex Mono',monospace;margin-top:1px;}
.mo-input{width:34px;border:none;background:transparent;color:var(--ink);text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:5px 2px;border-radius:5px;outline:none;}
.mo-input:focus{background:#f3eee2;}

/* worth source */
.src-grid{display:flex;flex-direction:column;gap:16px;}
.src-bar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:#ece5d6;}
.src-seg{height:100%;transition:width .4s ease;}
.src-rows{display:flex;flex-direction:column;gap:1px;}
.src-row{display:flex;align-items:center;gap:9px;padding:7px 2px;font-size:14px;border-bottom:1px solid #f0ebe0;}
.src-row:last-child{border-bottom:none;}
.src-row label{flex:1;color:var(--mut);}
.src-row.strong label{color:var(--ink);font-weight:500;}
.src-dot{width:9px;height:9px;border-radius:3px;flex:none;}
.src-val{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;}
.src-val.good{color:var(--green);}.src-val.bad{color:var(--red);}
.src-hr{height:1px;background:var(--line);margin:4px 0;}
.src-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.src-metric .lbl{margin-bottom:3px;}

/* cost basis / gain */
.inv-toggle{width:26px;height:24px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;color:#c9bba6;font-family:'IBM Plex Mono',monospace;font-size:13px;transition:.15s;}
.inv-toggle.on{background:#eaf3ee;border-color:#cfe6da;color:var(--green);font-weight:600;}
.inv-toggle:hover{border-color:var(--mut);}
.gain-cell{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;}
.gain-cell.good{color:var(--green);}.gain-cell.bad{color:var(--red);}
.gain-pct{font-size:11px;opacity:.7;}
.na{color:#cbc0ad;}
.fcell-wrap{display:inline-flex;align-items:center;gap:1px;justify-content:flex-end;position:relative;}
.fcell-mark{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);font-style:italic;margin-right:2px;opacity:.8;}
.pending-chip{display:inline-block;margin-left:6px;font-size:9.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;padding:2px 6px;border-radius:99px;background:#faf3e2;color:var(--gold);border:1px solid #ecdfbf;vertical-align:middle;}
.seed-notice{display:flex;align-items:center;gap:12px;background:#faf3e2;border:1px solid #ecdfbf;color:#7a6a3a;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;line-height:1.5;}
.seed-notice button{flex:none;background:#23201b;color:#f7f3ea;border:none;border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:'Spline Sans',sans-serif;}
.fm-table td{padding:3px 8px;border-bottom:1px solid #f0ebe0;}
.fm-table td.r{text-align:right;}
.fm-table td.nw{white-space:nowrap;}
.tf{font-family:'IBM Plex Mono',monospace;font-weight:600;font-variant-numeric:tabular-nums;padding-top:10px!important;border-bottom:none!important;}
.txt-input{border:none;background:transparent;color:var(--ink);font-size:14px;width:100%;padding:5px 4px;border-radius:5px;outline:none;font-family:'Spline Sans',sans-serif;}
.txt-input:focus{background:#f3eee2;}
.txt-input.muted{color:var(--mut);font-size:13px;}
.num-wrap{display:inline-flex;align-items:center;gap:1px;justify-content:flex-end;}
.num-prefix{color:var(--mut);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.num-input{border:none;background:transparent;color:var(--ink);text-align:right;font-size:14px;width:110px;padding:5px 4px;border-radius:5px;outline:none;font-weight:500;}
.num-input:focus{background:#f3eee2;}
.del{background:transparent;border:none;color:#c9bba6;cursor:pointer;padding:5px;border-radius:5px;display:inline-grid;place-items:center;transition:.15s;}
.del:hover{color:var(--red);background:#fbeeec;}
.addrow{margin-top:12px;background:transparent;border:1px dashed var(--line);color:var(--mut);padding:8px 13px;border-radius:8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:'Spline Sans',sans-serif;transition:.15s;}
.addrow:hover{border-color:var(--green);color:var(--green);}
.pill{font-size:10px;font-family:'IBM Plex Mono',monospace;padding:2px 7px;border-radius:99px;letter-spacing:.05em;}
.pill.future{background:#eaf3ee;color:var(--green);}
.pill.past{background:#f0ebe0;color:var(--mut);}
.status-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;padding:4px 10px;border-radius:99px;cursor:pointer;transition:.15s;color:var(--mut);}
.status-toggle .st-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.status-toggle.received{color:var(--green);background:#eaf3ee;border-color:#cfe6da;}
.status-toggle.pending{color:var(--gold);background:#faf3e2;border-color:#ecdfbf;}
.status-toggle:hover{filter:brightness(.97);box-shadow:0 0 0 2px #0000000a;}

/* plan */
.plan-list{display:flex;flex-direction:column;gap:4px;}
.planrow{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid #f0ebe0;}
.planrow-n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:12px;font-family:'IBM Plex Mono',monospace;flex:none;}
.planrow-mid{flex:1;display:flex;flex-direction:column;}
.planrow-lbl{font-size:14px;}
.planrow-note{font-size:11px;color:var(--mut);font-family:'IBM Plex Mono',monospace;}
.plan-rest{display:flex;align-items:center;gap:6px;color:var(--green);font-size:13.5px;padding:11px 4px 2px;font-style:italic;}
.proj-detail{display:flex;flex-direction:column;gap:2px;}
.pline{display:flex;justify-content:space-between;padding:7px 2px;font-size:14px;}
.pline span:first-child{color:var(--mut);}
.pline.strong{font-weight:600;}.pline.strong span:first-child{color:var(--ink);}
.pv{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.pv.bad{color:var(--red);}.pv.good{color:var(--green);}
.hr{height:1px;background:var(--line);margin:5px 0;}
.proj-note{font-size:12px;color:var(--mut);line-height:1.55;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);}
.fm-foot{text-align:center;font-size:11px;color:var(--mut);margin-top:22px;font-family:'IBM Plex Mono',monospace;}
.entry-scrim{position:fixed;inset:0;background:#23201bcc;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:200;overflow-y:auto;}
.entry-modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;padding:22px 24px 18px;box-shadow:0 20px 60px #00000040;}
.entry-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.entry-head h3{font-family:'Fraunces',serif;font-size:20px;margin:0;color:var(--ink);}
.entry-x{background:transparent;border:none;color:var(--mut);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px;}
.entry-x:hover{background:#0000000d;color:var(--ink);}
.entry-daterow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.entry-daterow label{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:0.04em;}
.entry-hint{font-size:12px;color:var(--mut);}
.entry-sec-title{font-family:'Fraunces',serif;font-size:14px;color:var(--ink);margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.entry-sec-sub{font-family:'Spline Sans',sans-serif;font-size:11.5px;color:var(--mut);font-weight:400;margin-left:6px;}
.entry-grid{display:flex;flex-direction:column;gap:7px;}
.entry-line{display:flex;align-items:center;gap:9px;}
.entry-cat{font-size:12.5px;color:var(--ink);padding:2px 9px;border:1px solid var(--line);border-left-width:3px;border-radius:6px;background:#00000005;white-space:nowrap;min-width:120px;}
.entry-amt{width:120px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-family:'IBM Plex Mono',monospace;text-align:right;background:var(--paper);}
.entry-amt:focus{outline:none;border-color:var(--gold);}
.entry-note{flex:1;border:none;border-bottom:1px dotted var(--line);background:transparent;font:inherit;font-size:12.5px;padding:4px 2px;color:var(--ink);}
.entry-note:focus{outline:none;border-bottom-color:var(--gold);}
.entry-newline{gap:8px;}
.entry-newname{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;background:var(--paper);}
.entry-dest{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
.entry-dest .seg-btn{padding:5px 10px;font-size:12px;}
.entry-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap;}
.entry-runningtotal{font-size:13px;color:var(--mut);font-family:'IBM Plex Mono',monospace;}
.entry-actions{display:flex;gap:8px;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;}
.btn-ghost:hover{color:var(--ink);border-color:var(--mut);}
.btn-primary{background:var(--green);border:1px solid transparent;color:#fff;border-radius:8px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer;}
.btn-primary:hover{filter:brightness(1.05);}
.btn-primary:disabled{opacity:0.4;cursor:default;}
.entry-reviewnote{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0 0 8px;}
.entry-rev{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line);}
.entry-rev-delta{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);}
.entry-arrow{color:var(--mut);}
.entry-add{color:var(--mut);font-size:11.5px;}
.entry-today{background:#b0852412;border:1px solid #b0852433;border-radius:10px;padding:9px 12px;margin-bottom:6px;}
.entry-today-h{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:6px;}
.entry-today-list{display:flex;flex-wrap:wrap;gap:6px;}
.entry-today-chip{font-size:11.5px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--ink);}
.entry-today-empty{font-size:11.5px;color:var(--mut);line-height:1.5;}
.entry-today-chip b{font-family:'IBM Plex Mono',monospace;}
.entry-today-chip.need{border-left:3px solid var(--green);}
.entry-newday{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#2d6a4f12;border:1px solid #2d6a4f33;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:12.5px;color:var(--ink);}
.entry-newday-x{background:var(--green);color:#fff;border:none;border-radius:7px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.entry-newday-x:hover{filter:brightness(1.08);}
.entry-line-wrap.is-dup .entry-cat{border-color:#b08524;}
.entry-src{border:1px solid var(--line);border-radius:7px;padding:6px 7px;font:inherit;font-size:12px;background:var(--paper);color:var(--ink);max-width:150px;}
.entry-src:focus{outline:none;border-color:var(--gold);}
.entry-src.wide-src{flex:1;max-width:none;}
.entry-loglines{display:flex;flex-direction:column;gap:10px;}
.entry-logline{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#00000004;}
.entry-logline.is-dup{border-color:#b08524;background:#b0852412;}
.entry-logline-main{display:flex;align-items:center;gap:8px;}
.entry-logcat{flex:1;min-width:0;}
.entry-dupwarn{font-size:11.5px;color:var(--gold);margin-top:6px;}
.entry-rev.is-dup .entry-cat{border-color:#b08524;}
.entry-basis-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);margin-top:7px;}
.entry-amt.sm{width:110px;}
.entry-debit{color:var(--red,#8c3a2b);font-family:'IBM Plex Mono',monospace;}
.kbd-hint{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
.kbd-sec{font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px;}
.kbd-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);}
.kbd-row span:last-child{color:var(--mut);text-align:right;}
.kbd-row kbd{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--paper);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink);}
.kbd-foot{font-size:11.5px;color:var(--mut);margin-top:12px;line-height:1.5;}
.collapse-h{cursor:pointer;user-select:none;}
.collapse-h:hover h3{color:var(--green);}
.collapse-caret{display:inline-block;width:14px;color:var(--mut);font-size:12px;}

/* needs grid */
.grid-scroll{overflow-x:auto;margin:-4px;padding:4px;}
.needs-table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;}
.needs-table th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:0 6px 9px;font-family:'IBM Plex Mono',monospace;border-bottom:1px solid var(--line);white-space:nowrap;}
.needs-table th.r,.needs-table td.r{text-align:right;}
.needs-table td{padding:2px 6px;border-bottom:1px solid #f0ebe0;}
.needs-table .sticky{position:sticky;left:0;background:var(--card);z-index:2;min-width:150px;}
.needs-table thead .sticky{z-index:3;}
.month-h{width:58px;border:none;background:transparent;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;outline:none;border-radius:4px;}
.month-h:focus{background:#f3eee2;}
.del-col{border:none;background:transparent;color:#cdbfa9;cursor:pointer;font-size:13px;line-height:1;padding:0 0 0 2px;}
.del-col:hover{color:var(--red);}
.need-cell{width:84px;border:none;background:transparent;text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:13px;padding:6px 5px;border-radius:5px;outline:none;color:var(--ink);}
.need-cell::placeholder{color:#cbc0ad;}
.need-cell:focus{background:#f3eee2;}
.total-col{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;border-left:1px solid var(--line);padding-left:12px!important;white-space:nowrap;}
.inline-del{margin-left:6px;vertical-align:middle;}
.needs-table tfoot .tf{padding-top:10px!important;border-bottom:none!important;font-weight:600;color:var(--ink);}
.needs-table tfoot .tf.hot{color:var(--red);}
.needs-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.needs-insight{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:14px;padding:11px 14px;border-radius:10px;}
.catpace-head{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--mut);padding:2px 12px 8px;border-bottom:1px solid var(--line);}
.catpace-head .r,.catpace-top .r{text-align:right;}
.catpace-switch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 12px;}
.catpace-switch .seg-btn{padding:4px 11px;font-size:12px;}
.catpace-row{padding:9px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;}
.catpace-row.over{border-left-color:var(--red,#8c3a2b);background:#8c3a2b08;}
.catpace-row.under{border-left-color:var(--green,#2d6a4f);background:#2d6a4f08;}
.catpace-row.ok{border-left-color:var(--line);}
.catpace-top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums;}
.catpace-name{font-weight:600;color:var(--ink);}
.catpace-sofar{color:var(--mut);}
.catpace-proj{font-weight:600;color:var(--ink);}
.catpace-avg{color:var(--mut);}
.catpace-tip{font-size:12px;color:var(--mut);margin-top:3px;}
.catpace-row.over .catpace-proj{color:var(--red,#8c3a2b);}
.catpace-row.under .catpace-proj{color:var(--green,#2d6a4f);}
.log-summary{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mut);padding:2px 2px 12px;}
.log-summary b{color:var(--ink);font-weight:600;}
.log-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.seg-btn{background:transparent;border:none;padding:6px 13px;font:inherit;font-size:13px;color:var(--mut);cursor:pointer;border-right:1px solid var(--line);}
.seg-btn:last-child{border-right:none;}
.seg-btn:hover{background:#0000000a;color:var(--ink);}
.seg-btn.on{background:var(--ink);color:var(--paper);}
.rows-ctl{font-size:13px;color:var(--mut);display:inline-flex;align-items:center;gap:6px;}
.log-controls-right{display:inline-flex;align-items:center;gap:14px;}
.link-btn{background:transparent;border:none;font:inherit;font-size:13px;color:var(--accent,#1f6f54);cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:2px;}
.link-btn:hover{opacity:0.75;}
.rows-ctl input{width:48px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;text-align:center;background:var(--paper);}
.grp-row{cursor:pointer;background:#0000000a;}
.grp-row:hover{background:#00000012;}
.grp-lbl{font-weight:600;color:var(--ink);}
.grp-n{font-weight:400;color:var(--mut);}
.grp-sub{font-weight:600;color:var(--ink);}
.catpick{position:relative;}
.cat-tag{display:inline-block;border:none;border-radius:6px;padding:3px 9px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;}
.cat-tag.sm{cursor:default;}
.cat-tag:hover{filter:brightness(0.96);}
.cat-empty{opacity:0.7;}
.cat-pop{position:absolute;z-index:40;top:-4px;left:0;width:210px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px #0000002e;padding:8px;}
.cat-search{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13px;background:#fff;margin-bottom:6px;}
.cat-list{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;}
.cat-opt{display:flex;align-items:center;gap:6px;background:transparent;border:none;border-radius:6px;padding:5px 6px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;width:100%;}
.cat-opt:hover{background:#0000000d;}
.cat-opt.create{color:var(--mut);}
.cat-none{font-size:12px;color:var(--mut);padding:6px;}
.reorder{white-space:nowrap;}
.drag-handle{display:inline-block;cursor:grab;color:var(--mut);font-size:13px;padding:0 4px;user-select:none;vertical-align:middle;}
.drag-handle:active{cursor:grabbing;}
.drag-ghost{opacity:0.35;background:#0000000f;}
.drag-chosen{background:var(--paper);box-shadow:0 6px 20px #00000026;}
.auto-bal{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;}
.auto-eff{font-weight:600;}
.auto-note{font-size:10.5px;color:var(--mut);}
.auto-toggle{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--mut);cursor:pointer;font-size:12px;padding:2px 6px;margin-right:6px;}
.auto-toggle.on{background:var(--accent,#1f6f54);color:#fff;border-color:transparent;}
.auto-toggle:hover{filter:brightness(0.95);}
.auto-config-row td{background:#0000000a;padding:8px 12px;}
.holdings-box{padding:4px 2px;}
.hold-derived{color:var(--mut);}
.holdings-head{display:grid;grid-template-columns:1.1fr 0.8fr 1fr 1fr 1fr 1fr 28px;gap:8px;font-size:10.5px;letter-spacing:0.03em;text-transform:uppercase;color:var(--mut);padding:0 2px 6px;}
.holdings-head .r{text-align:right;}
.holdings-row{display:grid;grid-template-columns:1.1fr 0.8fr 1fr 1fr 1fr 1fr 28px;gap:8px;align-items:center;padding:4px 2px;}
.hold-ticker{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-family:'IBM Plex Mono',monospace;background:var(--paper);text-transform:uppercase;}
.hold-ticker:focus{outline:none;border-color:var(--gold);}
.hold-num{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-family:'IBM Plex Mono',monospace;text-align:right;background:var(--paper);width:100%;}
.hold-num:focus{outline:none;border-color:var(--gold);}
.live-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.live-toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;color:var(--mut);cursor:pointer;}
.live-toggle.on{color:var(--green);border-color:var(--green);}
.live-led{width:8px;height:8px;border-radius:50%;background:var(--mut);}
.live-toggle.on .live-led{background:var(--green);box-shadow:0 0 0 3px rgba(45,106,79,.15);}
.live-stat{font-size:12px;color:var(--mut);font-family:'IBM Plex Mono',monospace;}
.live-refresh{border:1px solid var(--line);background:var(--card);border-radius:999px;width:26px;height:26px;font-size:14px;color:var(--mut);cursor:pointer;line-height:1;}
.live-refresh:hover{color:var(--green);border-color:var(--green);}
.stream-ctl{display:inline-flex;align-items:center;gap:8px;}
.stream-key{border:1px solid var(--line);border-radius:6px;padding:4px 9px;font:inherit;font-size:11.5px;font-family:'IBM Plex Mono',monospace;background:var(--paper);color:var(--ink);width:230px;}
.stream-key:focus{outline:none;border-color:var(--gold);}
.stream-pip{font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--mut);white-space:nowrap;}
.stream-pip.on{color:var(--green);}
.live-stat.stale{color:var(--gold);}
.ticker-search{position:relative;}
.ticker-busy{position:absolute;right:8px;top:6px;color:var(--mut);font-size:12px;pointer-events:none;}
.ticker-menu{position:absolute;z-index:30;top:calc(100% + 3px);left:0;right:0;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:240px;overflow:auto;}
.ticker-opt{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line);}
.ticker-opt:last-child{border-bottom:none;}
.ticker-opt:hover{background:var(--paper);}
.ticker-opt-top{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);}
.ticker-ex{color:var(--mut);font-size:11px;margin-left:6px;}
.ticker-nm{font-size:11px;color:var(--mut);margin-top:1px;}
.hold-price-cell{position:relative;display:flex;align-items:center;gap:6px;}
.live-pip{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.live-pip.fresh{background:var(--green);}
.live-pip.stale{background:var(--gold);}
.hold-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
.hold-gain{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
.hold-gain.good{color:var(--green);}.hold-gain.bad{color:var(--red);}
.holdings-note{font-size:11.5px;color:var(--mut);margin:8px 2px 0;line-height:1.5;}
.acct-tools{position:relative;}
.kill-confirm{position:absolute;top:50%;right:64px;transform:translateY(-50%);display:flex;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 4px 14px #0000002e;z-index:30;}
.kc-yes,.kc-no{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;padding:0;}
.kc-yes{background:var(--red,#8c3a2b);color:#fff;}
.kc-yes:hover{filter:brightness(1.08);}
.kc-no{background:#00000010;color:var(--ink);}
.kc-no:hover{background:#00000020;}
.auto-config{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);}
.auto-config label{display:inline-flex;align-items:center;gap:5px;}
.auto-lbl{font-weight:600;color:var(--ink);}
.num-input.mini,.mini{width:96px;font-size:12.5px;}
.day-input{width:48px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;text-align:center;background:var(--paper);}
.auto-result{color:var(--ink);}
.tip-wrap{position:relative;display:inline-block;margin-left:4px;}
.tip-icon{color:var(--gold,#b08524);cursor:help;font-size:12px;}
.tip-pop{position:absolute;z-index:50;right:0;top:140%;display:none;flex-direction:column;gap:2px;
